<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>💍 婚礼抽奖</title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  :root{
    --bg:#0c0a18; --panel:#17142b; --panel2:#1f1a38;
    --gold:#e9c46a; --gold-l:#f7e7b4; --text:#f2eefb; --muted:#8d86ad;
  }
  html,body{height:100%;margin:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(circle at 50% 0%,#241d47 0%,#0c0a18 55%);
    color:var(--text); overflow:hidden;
  }
  .hidden{display:none !important;}
  .page{position:fixed;inset:0;display:flex;flex-direction:column;}

  /* ---------- 头像 ---------- */
  .avatar{
    display:flex;align-items:center;justify-content:center;flex:none;
    border-radius:50%;color:#fff;font-weight:800;user-select:none;
    background:var(--c,linear-gradient(135deg,#5a5478,#3a3556));
    text-shadow:0 2px 8px rgba(0,0,0,.35);
  }
  .avatar.xl{width:clamp(140px,20vw,210px);height:clamp(140px,20vw,210px);font-size:clamp(56px,8vw,88px);}
  .avatar.xxl{width:100px;height:100px;font-size:40px;margin:0 auto 14px;}

  /* ---------- 用户加入页 ---------- */
  .join-wrap{margin:auto;text-align:center;padding:28px 24px;max-width:420px;width:100%;}
  .join-emoji{font-size:52px;line-height:1;}
  .join-title{font-size:28px;margin:8px 0 4px;color:var(--gold-l);letter-spacing:4px;}
  .join-sub{color:var(--muted);font-size:13px;margin:0 0 24px;}
  .input{
    width:100%;padding:15px;border-radius:14px;margin-bottom:12px;
    border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);
    color:var(--text);font-size:16px;text-align:center;outline:none;font-family:inherit;
    transition:border-color .2s;
  }
  .input::placeholder{color:#6a6390;}
  .input:focus{border-color:var(--gold);}
  .textarea{
    resize:none;height:88px;text-align:left;line-height:1.5;
    font-size:15px;padding:13px 16px;
  }
  .done-name{font-size:22px;font-weight:700;color:var(--gold-l);margin-bottom:8px;}
  .done-info{color:var(--muted);font-size:13px;margin-bottom:14px;line-height:1.6;}
  .done-info .bless{color:var(--gold-l);font-style:italic;}
  .done-tip{color:#7ee0a8;font-size:14px;margin-bottom:6px;}
  .done-tip.small{color:var(--muted);font-size:12px;}

  /* ---------- 按钮 ---------- */
  .btn{
    font-family:inherit;cursor:pointer;border:none;border-radius:12px;
    padding:12px 28px;font-size:16px;transition:.2s;
  }
  .btn.primary{
    background:linear-gradient(135deg,var(--gold),#c9963c);color:#1a1428;font-weight:700;
    box-shadow:0 6px 24px rgba(233,196,106,.3);
  }
  .btn.primary:hover{transform:translateY(-2px);box-shadow:0 10px 30px rgba(233,196,106,.45);}
  .btn.stop{
    background:linear-gradient(135deg,#ff7b7b,#d63b3b);color:#fff;font-weight:700;
    box-shadow:0 6px 24px rgba(214,59,59,.35);
  }
  .btn.stop:hover{transform:translateY(-2px);}
  .btn.big{padding:16px 60px;font-size:19px;letter-spacing:5px;border-radius:14px;}
  .btn.ghost{
    background:rgba(255,255,255,.06);color:var(--muted);
    border:1px solid rgba(255,255,255,.1);padding:8px 16px;font-size:14px;
  }
  .btn.ghost:hover{color:var(--text);background:rgba(255,255,255,.12);}
  #joinForm .btn{width:100%;padding:15px;font-size:17px;margin-top:4px;}

  /* ---------- 主持人页面 ---------- */
  .hdr{
    height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 22px;border-bottom:1px solid rgba(255,255,255,.07);
    background:rgba(23,20,43,.6);backdrop-filter:blur(10px);z-index:5;
  }
  .brand{font-size:19px;font-weight:700;letter-spacing:1px;color:var(--gold-l);}
  .room-tag{font-size:12px;color:var(--muted);font-weight:400;margin-left:8px;}
  .hdr-actions{display:flex;gap:10px;}

  .body{flex:1;display:flex;min-height:0;padding:16px;gap:16px;}

  .side{
    width:270px;flex:none;background:var(--panel);border-radius:18px;padding:16px;
    display:flex;flex-direction:column;min-height:0;
    border:1px solid rgba(255,255,255,.06);
  }
  .side-title{font-size:13px;color:var(--muted);margin-bottom:12px;flex:none;}
  .side-title b{color:var(--gold);font-size:20px;margin:0 2px;}
  .user-grid{
    flex:1;overflow-y:auto;display:grid;gap:14px 6px;align-content:start;
    grid-template-columns:repeat(auto-fill,minmax(66px,1fr));
  }
  .user-grid::-webkit-scrollbar{width:5px;}
  .user-grid::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .user-chip{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;}
  .user-chip .avatar{width:44px;height:44px;font-size:17px;}
  .user-chip .chip-name{
    font-size:11px;color:var(--muted);max-width:100%;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .user-chip .chip-phone{font-size:10px;color:#5d577e;letter-spacing:.5px;}
  .user-chip.won .avatar{filter:grayscale(.85) brightness(.55);}
  .user-chip.won .chip-name{opacity:.4;text-decoration:line-through;}
  .side-empty{color:var(--muted);font-size:13px;text-align:center;padding:30px 0;}

  .stage-panel{
    flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;
    background:var(--panel);border-radius:18px;padding:18px;
    border:1px solid rgba(255,255,255,.06);
  }

  .prize-tabs{display:flex;gap:10px;flex:none;}
  .prize-tab{
    background:transparent;border:1px solid rgba(255,255,255,.15);color:var(--muted);
    padding:8px 22px;border-radius:999px;font-size:15px;cursor:pointer;
    transition:.2s;font-family:inherit;
  }
  .prize-tab:hover{color:var(--text);border-color:rgba(255,255,255,.3);}
  .prize-tab.active{
    background:linear-gradient(135deg,var(--gold),#c99b3c);color:#241d47;
    border-color:transparent;font-weight:700;box-shadow:0 0 24px rgba(233,196,106,.35);
  }

  .stage{
    flex:1;position:relative;width:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  }
  .stage-badge{
    position:absolute;top:8px;right:8px;font-size:13px;color:var(--gold);
    border:1px solid rgba(233,196,106,.4);padding:5px 16px;border-radius:999px;
  }
  .stage .avatar.xl{
    border:4px solid rgba(233,196,106,.3);
    box-shadow:0 0 60px rgba(233,196,106,.2),inset 0 -20px 40px rgba(0,0,0,.25);
    transition:transform .15s;
  }
  .stage.final .avatar.xl{
    border-color:var(--gold);
    box-shadow:0 0 90px rgba(233,196,106,.85),0 0 160px rgba(233,196,106,.4);
    animation:pop .65s cubic-bezier(.2,1.6,.4,1);
  }
  @keyframes pop{0%{transform:scale(.75)}60%{transform:scale(1.14)}100%{transform:scale(1)}}
  .stage-name{
    font-size:clamp(24px,3.2vw,40px);font-weight:800;letter-spacing:3px;
    color:var(--gold-l);min-height:1.2em;text-align:center;
  }
  .stage-info{
    text-align:center;max-width:min(640px,90%);
    animation:fadeIn .5s ease;
  }
  .stage-phone{
    font-size:14px;color:var(--muted);letter-spacing:2px;
    margin-bottom:10px;
  }
  .stage-blessing{
    font-size:clamp(15px,1.5vw,18px);line-height:1.7;
    color:var(--gold-l);font-style:italic;
    padding:14px 22px;border-radius:14px;
    background:rgba(233,196,106,.08);
    border:1px solid rgba(233,196,106,.18);
  }
  @keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

  .controls{display:flex;gap:16px;margin-bottom:12px;flex:none;}

  .winner-bar{width:100%;flex:none;border-top:1px solid rgba(255,255,255,.07);padding-top:12px;}
  .winner-title{font-size:13px;color:var(--muted);margin-bottom:8px;}
  .winner-list{display:flex;gap:10px;overflow-x:auto;min-height:46px;align-items:center;}
  .winner-list::-webkit-scrollbar{height:5px;}
  .winner-list::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .winner-item{
    display:flex;align-items:center;gap:8px;flex:none;
    background:rgba(233,196,106,.1);border:1px solid rgba(233,196,106,.25);
    border-radius:999px;padding:5px 16px 5px 5px;
  }
  .winner-item .avatar{width:32px;height:32px;font-size:13px;}
  .winner-item span{font-size:14px;color:var(--gold-l);}

  /* ---------- 弹窗通用 ---------- */
  .modal{
    position:fixed;inset:0;background:rgba(6,4,14,.88);z-index:100;
    display:flex;align-items:center;justify-content:center;backdrop-filter:blur(6px);
    padding:20px;
  }
  .modal-card{
    background:var(--panel2);border-radius:24px;padding:28px;text-align:center;
    border:1px solid rgba(233,196,106,.2);max-width:520px;width:100%;
    max-height:88vh;display:flex;flex-direction:column;
  }
  .modal-card h2{margin:0 0 20px;font-size:19px;color:var(--gold-l);letter-spacing:2px;flex:none;}
  .qr-box{background:#fff;padding:12px;border-radius:16px;display:inline-block;align-self:center;}
  .qr-box img{display:block;width:min(240px,58vw);height:min(240px,58vw);}
  .qr-url{
    font-size:12px;color:var(--muted);margin:14px auto 18px;
    word-break:break-all;max-width:300px;
  }
  .qr-warn{color:#ff9d6b;font-size:12px;margin-bottom:14px;}

  /* ---------- 祝福墙 ---------- */
  .blessing-wall{
    flex:1;overflow-y:auto;text-align:left;padding-right:6px;
    display:flex;flex-direction:column;gap:12px;margin-bottom:18px;
  }
  .blessing-wall::-webkit-scrollbar{width:5px;}
  .blessing-wall::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px;}
  .blessing-card{
    display:flex;gap:12px;padding:14px;
    background:rgba(255,255,255,.04);border-radius:14px;
    border:1px solid rgba(255,255,255,.06);
  }
  .blessing-card .avatar{width:42px;height:42px;font-size:16px;flex:none;}
  .bc-body{flex:1;min-width:0;}
  .bc-name{
    font-size:14px;font-weight:700;color:var(--gold-l);
    margin-bottom:4px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;
  }
  .bc-name em{font-style:normal;font-size:11px;color:var(--muted);font-weight:400;letter-spacing:1px;}
  .bc-text{font-size:14px;line-height:1.6;color:#d8d3ec;word-break:break-word;}
  .wall-empty{color:var(--muted);font-size:14px;text-align:center;padding:40px 0;}

  @media (max-width:820px){
    .side{width:190px;}
    .btn.big{padding:14px 40px;font-size:17px;}
    .prize-tab{padding:7px 14px;font-size:13px;}
  }
</style>
</head>
<body>

<!-- ==================== 用户加入页 ==================== -->
<div id="joinPage" class="page hidden">
  <div class="join-wrap">
    <div class="join-emoji">💍</div>
    <h1 class="join-title">婚礼抽奖</h1>
    <p class="join-sub">留下联系方式与祝福，即可加入抽奖池</p>

    <div id="joinForm">
      <input id="nameInput" class="input" type="text" placeholder="你的名字 / 昵称"
             maxlength="8" autocomplete="off">
      <input id="phoneInput" class="input" type="tel" placeholder="手机号（中奖后联系您）"
             maxlength="11" inputmode="numeric" autocomplete="off">
      <textarea id="blessingInput" class="input textarea"
                placeholder="写一句祝福送给新人吧～（60字内）"
                maxlength="60"></textarea>
      <button id="joinBtn" class="btn primary">加入抽奖</button>
    </div>

    <div id="joinDone" class="hidden">
      <div class="avatar xxl" id="meAvatar">?</div>
      <div class="done-name" id="meName"></div>
      <div class="done-info" id="meInfo"></div>
      <div class="done-tip">✅ 已加入抽奖池</div>
      <div class="done-tip small">请留意大屏幕，祝你好运！</div>
    </div>
  </div>
</div>

<!-- ==================== 主持人页 ==================== -->
<div id="hostPage" class="page hidden">
  <header class="hdr">
    <div class="brand">💍 婚礼抽奖 <span class="room-tag" id="roomTag"></span></div>
    <div class="hdr-actions">
      <button class="btn ghost" id="wallBtn">💌 祝福墙</button>
      <button class="btn ghost" id="qrBtn">📱 扫码入口</button>
      <button class="btn ghost" id="resetBtn">↺ 重置</button>
    </div>
  </header>

  <div class="body">
    <aside class="side">
      <div class="side-title">已加入 <b id="userCount">0</b> 人</div>
      <div class="user-grid" id="userGrid"></div>
      <div class="side-empty" id="sideEmpty">等待大家扫码加入…</div>
    </aside>

    <section class="stage-panel">
      <div class="prize-tabs" id="prizeTabs">
        <button class="prize-tab active" data-prize="1">🥇 一等奖</button>
        <button class="prize-tab" data-prize="2">🥈 二等奖</button>
        <button class="prize-tab" data-prize="3">🥉 三等奖</button>
      </div>

      <div class="stage" id="stage">
        <div class="stage-badge" id="stageBadge">一等奖</div>
        <div class="avatar xl" id="stageAvatar">?</div>
        <div class="stage-name" id="stageName">准备开始</div>
        <div class="stage-info hidden" id="stageInfo">
          <div class="stage-phone" id="stagePhone"></div>
          <div class="stage-blessing" id="stageBlessing"></div>
        </div>
      </div>

      <div class="controls">
        <button class="btn primary big" id="startBtn">开始抽奖</button>
        <button class="btn stop big hidden" id="stopBtn">停 止</button>
      </div>

      <div class="winner-bar">
        <div class="winner-title" id="winnerTitle">一等奖 · 0 人</div>
        <div class="winner-list" id="winnerList"></div>
      </div>
    </section>
  </div>
</div>

<!-- ==================== 二维码弹窗 ==================== -->
<div class="modal hidden" id="qrModal">
  <div class="modal-card">
    <h2>扫码加入抽奖</h2>
    <div class="qr-box"><img id="qrImg" alt="二维码"></div>
    <div class="qr-url" id="qrUrl"></div>
    <div class="qr-warn hidden" id="qrWarn">
      ⚠️ 当前是本地文件打开，二维码无法被手机访问。请把页面部署到网站后再使用。
    </div>
    <button class="btn primary" id="qrClose">关闭</button>
  </div>
</div>

<!-- ==================== 祝福墙弹窗 ==================== -->
<div class="modal hidden" id="wallModal">
  <div class="modal-card">
    <h2>💌 宾客祝福</h2>
    <div class="blessing-wall" id="blessingWall"></div>
    <button class="btn primary" id="wallClose">关闭</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  /* =========================================================
     基础配置
     ========================================================= */
  const MQTT_BROKER = 'wss://broker.emqx.io:8084/mqtt';
  const TOPIC       = 'wedding-lottery';
  const PRIZE_NAMES = { '1': '一等奖', '2': '二等奖', '3': '三等奖' };

  const params = new URLSearchParams(location.search);
  const MODE   = params.get('mode') === 'user' ? 'user' : 'host';

  let roomId = (params.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (MODE === 'host') {
    if (!roomId) {
      roomId = localStorage.getItem('wl_room') ||
               Math.random().toString(36).slice(2, 6).toUpperCase();
      localStorage.setItem('wl_room', roomId);
    }
  }
  if (!roomId) roomId = 'DEMO';

  const K = {
    users  : 'wl_users_'   + roomId,
    winners: 'wl_winners_' + roomId,
    me     : 'wl_me_'      + roomId
  };

  /* =========================================================
     全局状态
     ========================================================= */
  let users        = [];
  let winners      = { '1': [], '2': [], '3': [] };
  let currentPrize = '1';
  let spinning     = false;
  let reelTimer    = null;
  let mqttClient   = null;
  let bc           = null;

  /* =========================================================
     工具函数
     ========================================================= */
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c =>
      ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }
  function readJSON(key, def) {
    try {
      const v = JSON.parse(localStorage.getItem(key));
      return (v === null || v === undefined) ? def : v;
    } catch (e) { return def; }
  }
  function colorFor(name) {
    let h = 0;
    const s = String(name || '?');
    for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return `linear-gradient(135deg,hsl(${h},70%,58%),hsl(${(h + 45) % 360},70%,44%))`;
  }
  function isValidPhone(p) {
    return /^1[3-9]\d{9}$/.test(p);
  }
  function maskPhone(p) {
    if (!p || p.length < 7) return p || '';
    return p.slice(0, 3) + '****' + p.slice(-4);
  }

  /* =========================================================
     实时通信层
     ========================================================= */
  function initRealtime() {
    if (window.mqtt && typeof window.mqtt.connect === 'function') {
      try {
        mqttClient = window.mqtt.connect(MQTT_BROKER, {
          clientId: 'wl_' + Math.random().toString(16).slice(2, 10),
          connectTimeout: 6000,
          reconnectPeriod: 4000,
          clean: true,
          keepalive: 30
        });
        mqttClient.on('connect', onMqttConnect);
        mqttClient.on('message', onMqttMessage);
        mqttClient.on('error', function () {});
      } catch (e) {
        mqttClient = null;
      }
    }

    if ('BroadcastChannel' in window) {
      bc = new BroadcastChannel('wl_' + roomId);
      bc.onmessage = function (e) { handleEvent(e.data); };
    }
  }

  function onMqttConnect() {
    if (MODE === 'host') {
      mqttClient.subscribe([
        `${TOPIC}/${roomId}/user/+`,
        `${TOPIC}/${roomId}/event`
      ]);
    } else {
      const me = readJSON(K.me, null);
      if (me) publishJoin(me);
    }
  }

  function onMqttMessage(topic, payload) {
    const parts = topic.split('/');
    const kind  = parts[parts.length - 2];
    let data;
    try { data = JSON.parse(payload.toString()); } catch (e) { return; }
    if (kind === 'user')      addUser(data);
    else if (kind === 'event') handleEvent(data);
  }

  function handleEvent(msg) {
    if (!msg || !msg.type || MODE !== 'host') return;
    if (msg.type === 'join') addUser(msg.user);
  }

  /* =========================================================
     用户端逻辑
     ========================================================= */
  function initJoinPage() {
    document.getElementById('joinPage').classList.remove('hidden');

    const me = readJSON(K.me, null);
    if (me) showJoined(me);

    document.getElementById('joinBtn').onclick = doJoin;
    document.getElementById('blessingInput').addEventListener('input', function () {
      // 实时显示剩余字数
    });
  }

  function doJoin() {
    const name     = document.getElementById('nameInput').value.trim();
    const phone    = document.getElementById('phoneInput').value.trim();
    const blessing = document.getElementById('blessingInput').value.trim();

    if (!name) {
      alert('请填写你的名字'); return;
    }
    if (!isValidPhone(phone)) {
      alert('请填写正确的 11 位手机号'); return;
    }
    if (!blessing) {
      alert('请写一句祝福送给新人吧～'); return;
    }

    let me = readJSON(K.me, null);
    if (me) {
      me.name = name; me.phone = phone; me.blessing = blessing;
    } else {
      me = {
        id: 'u' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        name: name,
        phone: phone,
        blessing: blessing,
        joinedAt: Date.now()
      };
    }
    localStorage.setItem(K.me, JSON.stringify(me));
    publishJoin(me);
    showJoined(me);
  }

  function publishJoin(user) {
    if (mqttClient && mqttClient.connected) {
      mqttClient.publish(
        `${TOPIC}/${roomId}/user/${user.id}`,
        JSON.stringify(user),
        { retain: true, qos: 0 }
      );
    }
    if (bc) bc.postMessage({ type: 'join', user: user });
  }

  function showJoined(me) {
    document.getElementById('joinForm').classList.add('hidden');
    document.getElementById('joinDone').classList.remove('hidden');

    const av = document.getElementById('meAvatar');
    av.style.setProperty('--c', colorFor(me.name));
    av.textContent = me.name.charAt(0);
    document.getElementById('meName').textContent = me.name;
    document.getElementById('meInfo').innerHTML =
      maskPhone(me.phone) + '<br><span class="bless">「' + esc(me.blessing) + '」</span>';
  }

  /* =========================================================
     主持人端逻辑
     ========================================================= */
  function initHostPage() {
    document.getElementById('hostPage').classList.remove('hidden');
    document.getElementById('roomTag').textContent = '房间 ' + roomId;

    users   = readJSON(K.users, []);
    winners = readJSON(K.winners, { '1': [], '2': [], '3': [] });
    ['1', '2', '3'].forEach(function (k) { if (!Array.isArray(winners[k])) winners[k] = []; });

    renderUsers();
    renderWinners();
    updateBadge();

    document.getElementById('qrBtn').onclick    = showQR;
    document.getElementById('qrClose').onclick  = function () {
      document.getElementById('qrModal').classList.add('hidden');
    };
    document.getElementById('wallBtn').onclick  = showWall;
    document.getElementById('wallClose').onclick = function () {
      document.getElementById('wallModal').classList.add('hidden');
    };
    document.getElementById('resetBtn').onclick = resetAll;
    document.getElementById('startBtn').onclick = startSpin;
    document.getElementById('stopBtn').onclick  = stopSpin;

    document.querySelectorAll('.prize-tab').forEach(function (tab) {
      tab.onclick = function () {
        if (spinning) return;
        currentPrize = tab.dataset.prize;
        document.querySelectorAll('.prize-tab').forEach(function (t) {
          t.classList.toggle('active', t === tab);
        });
        updateBadge();
        renderWinners();
      };
    });
  }

  /* ---------- 用户列表 ---------- */
  function addUser(u) {
    if (!u || !u.id || !u.name) return;

    const exist = users.find(function (x) { return x.id === u.id; });
    if (exist) {
      if (exist.name !== u.name || exist.phone !== u.phone || exist.blessing !== u.blessing) {
        exist.name     = u.name;
        exist.phone    = u.phone || '';
        exist.blessing = u.blessing || '';
        saveUsers();
        renderUsers();
      }
      return;
    }
    users.push({
      id: u.id,
      name: u.name,
      phone: u.phone || '',
      blessing: u.blessing || '',
      joinedAt: u.joinedAt || Date.now()
    });
    saveUsers();
    renderUsers();
  }

  function saveUsers()   { localStorage.setItem(K.users, JSON.stringify(users)); }
  function saveWinners() { localStorage.setItem(K.winners, JSON.stringify(winners)); }

  function getWinnerIds() {
    const s = new Set();
    ['1', '2', '3'].forEach(function (k) {
      (winners[k] || []).forEach(function (u) { s.add(u.id); });
    });
    return s;
  }

  function getPool() {
    const won = getWinnerIds();
    return users.filter(function (u) { return !won.has(u.id); });
  }

  function renderUsers() {
    const grid   = document.getElementById('userGrid');
    const wonIds = getWinnerIds();
    document.getElementById('userCount').textContent = users.length;
    document.getElementById('sideEmpty').classList.toggle('hidden', users.length > 0);

    grid.innerHTML = users.map(function (u) {
      const tail = u.phone ? u.phone.slice(-4) : '----';
      return '<div class="user-chip' + (wonIds.has(u.id) ? ' won' : '') + '" title="' +
               esc(u.blessing || '') + '">' +
               '<div class="avatar" style="--c:' + colorFor(u.name) + '">' +
                 esc(u.name.charAt(0)) +
               '</div>' +
               '<span class="chip-name">' + esc(u.name) + '</span>' +
               '<span class="chip-phone">尾号' + esc(tail) + '</span>' +
             '</div>';
    }).join('');
  }

  function renderWinners() {
    const list = winners[currentPrize] || [];
    document.getElementById('winnerTitle').textContent =
      PRIZE_NAMES[currentPrize] + ' · ' + list.length + ' 人';

    document.getElementById('winnerList').innerHTML = list.map(function (u) {
      return '<div class="winner-item">' +
               '<div class="avatar" style="--c:' + colorFor(u.name) + '">' +
                 esc(u.name.charAt(0)) +
               '</div><span>' + esc(u.name) + '</span>' +
             '</div>';
    }).join('');
  }

  function updateBadge() {
    document.getElementById('stageBadge').textContent = PRIZE_NAMES[currentPrize];
  }

  /* ---------- 抽奖核心 ---------- */
  function startSpin() {
    if (spinning) return;

    const pool = getPool();
    if (pool.length === 0) {
      alert(users.length === 0 ? '还没有人加入抽奖哦～' : '所有人都已经中奖啦！');
      return;
    }

    spinning = true;
    document.getElementById('stage').classList.remove('final');
    document.getElementById('stageInfo').classList.add('hidden');
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('stopBtn').classList.remove('hidden');

    clearInterval(reelTimer);
    reelTimer = setInterval(function () {
      renderStage(pool[Math.floor(Math.random() * pool.length)]);
    }, 60);
  }

  function stopSpin() {
    if (!spinning) return;
    clearInterval(reelTimer);

    const pool   = getPool();
    const winner = pool[Math.floor(Math.random() * pool.length)];

    let delay = 70;
    let n     = 0;
    (function tick() {
      if (n >= 7) { finalize(winner); return; }
      renderStage(pool[Math.floor(Math.random() * pool.length)]);
      n++;
      delay *= 1.3;
      setTimeout(tick, delay);
    })();
  }

  function renderStage(u) {
    const av = document.getElementById('stageAvatar');
    av.style.setProperty('--c', colorFor(u.name));
    av.textContent = u.name.charAt(0);
    document.getElementById('stageName').textContent = u.name;
  }

  function finalize(winner) {
    spinning = false;

    renderStage(winner);
    document.getElementById('stage').classList.add('final');

    // 展示手机号与祝福
    const info = document.getElementById('stageInfo');
    document.getElementById('stagePhone').textContent =
      winner.phone ? maskPhone(winner.phone) : '';
    document.getElementById('stageBlessing').textContent =
      winner.blessing ? '「' + winner.blessing + '」' : '';
    info.classList.toggle('hidden', !winner.phone && !winner.blessing);

    winners[currentPrize] = winners[currentPrize] || [];
    winners[currentPrize].push(winner);
    saveWinners();

    renderWinners();
    renderUsers();

    document.getElementById('stopBtn').classList.add('hidden');
    const sb = document.getElementById('startBtn');
    sb.classList.remove('hidden');
    sb.textContent = '下一轮';
  }

  /* ---------- 重置 ---------- */
  function resetAll() {
    if (!confirm('确定清空本轮所有中奖记录吗？（用户名单与祝福保留）')) return;

    winners = { '1': [], '2': [], '3': [] };
    saveWinners();
    renderWinners();
    renderUsers();

    document.getElementById('stage').classList.remove('final');
    document.getElementById('stageInfo').classList.add('hidden');
    const av = document.getElementById('stageAvatar');
    av.style.removeProperty('--c');
    av.textContent = '?';
    document.getElementById('stageName').textContent = '准备开始';
    document.getElementById('startBtn').textContent = '开始抽奖';
  }

  /* ---------- 二维码 ---------- */
  function getJoinUrl() {
    const u = new URL(location.href);
    u.search = '';
    u.hash   = '';
    u.searchParams.set('mode', 'user');
    u.searchParams.set('room', roomId);
    return u.toString();
  }

  function showQR() {
    const url = getJoinUrl();
    document.getElementById('qrUrl').textContent = url;
    document.getElementById('qrImg').src =
      'https://api.qrserver.com/v1/create-qr-code/?size=520x520&margin=8&data=' +
      encodeURIComponent(url);
    document.getElementById('qrWarn')
            .classList.toggle('hidden', location.protocol !== 'file:');
    document.getElementById('qrModal').classList.remove('hidden');
  }

  /* ---------- 祝福墙 ---------- */
  function showWall() {
    const wall = document.getElementById('blessingWall');
    if (users.length === 0) {
      wall.innerHTML = '<div class="wall-empty">还没有宾客留言～</div>';
    } else {
      wall.innerHTML = users.map(function (u) {
        return '<div class="blessing-card">' +
                 '<div class="avatar" style="--c:' + colorFor(u.name) + '">' +
                   esc(u.name.charAt(0)) +
                 '</div>' +
                 '<div class="bc-body">' +
                   '<div class="bc-name">' + esc(u.name) +
                     '<em>' + esc(u.phone ? maskPhone(u.phone) : '') + '</em>' +
                   '</div>' +
                   '<div class="bc-text">' + esc(u.blessing || '（未填写祝福）') + '</div>' +
                 '</div>' +
               '</div>';
      }).join('');
    }
    document.getElementById('wallModal').classList.remove('hidden');
  }

  /* =========================================================
     启动
     ========================================================= */
  if (MODE === 'user') initJoinPage();
  else                 initHostPage();

  initRealtime();

})();
</script>
</body>
</html>
